name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  container-image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          ./gradlew check jib
          -Djib.from.platforms=linux/amd64,linux/arm64
          -Djib.to.image="ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}"
          $([[ "$GITHUB_REF_NAME" != *-* ]] && echo -Djib.to.tags=latest)
          -Djib.container.labels="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY,org.opencontainers.image.version=${GITHUB_REF_NAME#v},org.opencontainers.image.revision=$GITHUB_SHA,org.opencontainers.image.licenses=Apache-2.0"
      - id: digest
        run: echo "digest=$(cat build/jib-image.digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    name: Release
    needs: [container-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
